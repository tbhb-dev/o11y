#:schema https://mise.jdx.dev/schema/mise.json
# The repo-specific half of the task and toolchain definitions. The shared
# half arrives through vendir: tool pins in .config/mise/conf.d/, tasks
# under .devtools/tasks/ selected by the task_config includes below.

[settings]
lockfile = true
# uv owns any Python interpreter; stop mise from reading .python-version too.
idiomatic_version_file_enable_tools = []

[tools]
# vendir can't come from the payload it delivers: bootstrap syncs before it installs.
vendir = "0.46.1"
apm = "0.33.0"
shfmt = "3.14.1"
jq = "1.8.2"
# Keep guard-markdown at the devtools release; Renovate reads the go backend pin.
"go:github.com/tbhb-dev/devtools/cmd/guard-markdown" = "v0.11.0"
# Runs tools/apm_audit.py, the one Python file this repo needs.
uv = "0.12.23"
# The Compose version the deploy host runs, so the local tests load and run
# the stack with it. The binary is docker-cli-plugin-docker-compose.
"aqua:docker/compose" = "2.20.1"

[env]
DEVTOOLS_LOCK_PLATFORMS = "linux-x64,macos-arm64"
UV_PYTHON_PREFERENCE = "only-managed"

[task_config]
includes = [
  ".devtools/tasks/fix.toml",
  ".devtools/tasks/format.toml",
  ".devtools/tasks/git-hooks.toml",
  ".devtools/tasks/leaks.toml",
  ".devtools/tasks/lint.toml",
  ".devtools/tasks/pins.toml",
  ".devtools/tasks/preapproval.toml",
  ".devtools/tasks/security.toml",
  ".devtools/tasks/toolchain.toml",
  ".devtools/tasks/vendir.toml",
]

[tasks.bootstrap]
description = "Sync the vendored payload, install the toolchain, and install git hooks"
alias = "setup"
run = [
  "vendir sync",
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run devtools:prek-install",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and the vendored conf.d"
run = "mise install"

[tasks.install-tools]
description = "Download the Vale style packages .vale.ini names"
run = "vale sync"

# APM merges hook declarations into each harness's settings additively and
# never reconciles, while `apm audit --ci` replays the same merge from an
# empty tree and compares. Clearing the keys APM owns first hands the
# merge the empty slate its replay assumes. Only those keys go, so a
# hand-written setting elsewhere in each file survives. devtools:update-pins
# calls this task by name.
[tasks.apm-sync]
description = "Redeploy the APM primitives from a cleared hook state, then audit"
depends_post = ["lint-apm"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
clear_key() {
  local file=$1 key=$2
  [[ -f $file ]] || return 0
  jq "del(.$key)" "$file" >"$file.tmp"
  mv "$file.tmp" "$file"
  [[ $(jq 'length' "$file") -gt 0 ]] || rm -f "$file"
}
clear_key .claude/settings.json hooks
clear_key .codex/hooks.json hooks
rm -f .claude/apm-hooks.json .codex/apm-hooks.json
apm install
'''

# `apm audit --ci` replays the install into a scratch tree and diffs it
# against the deployed files. APM scans each harness root whole, which
# crosses into the agent worktrees under .claude/ and .codex/, so the
# wrapper excludes Unicode findings inside registered worktrees and keeps
# every other check.
[tasks.lint-apm]
description = "Check the deployed APM primitives against apm.lock.yaml"
run = "uv run --no-project --python 3.14 python tools/apm_audit.py"

[tasks.lint-commit-msg]
extends = "devtools:lint-commit-msg"

[tasks.lint-squash-msg]
extends = "devtools:lint-squash-msg"

# The pull request counterpart the pr skill calls. Body copied from
# devtools/mise.toml [tasks.lint-pr-description]; validate-description.sh
# exists once apm install has deployed the pr skill.
[tasks.lint-pr-description]
extends = "devtools:lint-pr-description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=ai-tells-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress PR_AGENTDESC.md",
  "mise run devtools:lint-leaks -- PR_AGENTDESC.md",
]

# Both draft tasks are scoped to the one file they receive. The fix-prose
# skills call them by name. The scripts are copies of the devtools ones.
[tasks.lint-draft]
extends = "devtools:lint-draft"
run = 'bash tools/lint-draft.sh "$usage_file"'

[tasks.fix-prose-replacements]
extends = "devtools:fix-prose-replacements"
run = 'uv run --script tools/fix_prose_replacements.py "$usage_file"'

# Body copied from devtools/mise.toml [tasks.lint-prose]; the glob is why it
# stays repo-specific. The deployed agent primitives answer to upstream's
# prose, so the harness skill and rule trees are excluded.
[tasks.lint-prose]
extends = "devtools:lint-prose"
run = "vale --output=ai-tells-agent.tmpl --glob='!{LICENSE,CHANGELOG.md,.vale/*,tmp/*,apm_modules/*,.claude/skills/*,.claude/rules/*,.agents/skills/*,.claude/worktrees/*,.codex/worktrees/*,.worktrees/*,COMMIT_AGENTMSG,PR_AGENTDESC.md,SQUASH_AGENTMSG}' $usage_paths"

[tasks.lint-markdown-wrap]
description = "Fail if any Markdown paragraph spans more than one line"
run = '''
#!/usr/bin/env bash
set -euo pipefail
files=$(git ls-files '*.md' ':!:CHANGELOG.md')
if [[ -n $files ]]; then guard-markdown $files; fi
'''

# Two tasks, not one: the fix-pr skill maps a failing "shell" check to
# `mise run lint-shell && mise run lint-shell-fmt` (fix-pr/scripts/diagnose.sh).
[tasks.lint-shell]
description = "Lint the shell scripts via shellcheck"
run = '''
#!/usr/bin/env bash
set -euo pipefail
files=$(git ls-files --cached --others --exclude-standard -- '*.sh' ':!:.claude/**' ':!:.agents/**')
[[ -z $files ]] || shellcheck $files
'''

[tasks.lint-shell-fmt]
description = "Fail if shfmt would reformat any shell script"
run = '''
#!/usr/bin/env bash
set -euo pipefail
files=$(git ls-files --cached --others --exclude-standard -- '*.sh' ':!:.claude/**' ':!:.agents/**')
[[ -z $files ]] || shfmt -d $files
'''

# What shellcheck can't see: a curl without --fail turns an HTTP error
# into an answer. .shellcheckrc turns on the masked status check that
# covers the rest of that class.
[tasks.lint-curl]
description = "Fail when a curl in tools/*.sh has no fail option and no allow comment"
run = "bash tools/check-curl-fail.sh"

# Also beyond shellcheck: `! grep -q` and `! cmp -s` read their own failure
# as an answer, and grep -q's early exit can turn SIGPIPE into a pass.
[tasks.lint-negated]
description = "Fail when a script in tools/*.sh negates grep -q or cmp -s without an allow comment"
run = "bash tools/check-negated-status.sh"

[tasks.lint]
extends = "devtools:lint"
run = [
  "mise run devtools:check-vendored",
  "mise run devtools:lint-leaks",
  "mise run devtools:check-leak-hook",
  "mise run devtools:check-pins",
  "mise run lint-apm",
  "mise run lint-prose",
  "mise run devtools:lint-spelling",
  "mise run devtools:lint-markdown",
  "mise run lint-markdown-wrap",
  "mise run devtools:lint-config",
  "mise run devtools:lint-yaml",
  "mise run devtools:lint-toml",
  "mise run devtools:lint-workflows",
  "mise run devtools:lint-mise",
  "mise run lint-shell",
  "mise run lint-shell-fmt",
  "mise run lint-curl",
  "mise run lint-negated",
]

[tasks.test-tools]
description = "Test the prose fixer's failure handling, the curl check and the negated-status check"
run = "bats tools/fix-prose-replacements.bats tools/check-curl-fail.bats tools/check-negated-status.bats"

[tasks.test-stack]
description = "Test the release renderer, the S3 probe, validation's isolation, the fault run's memory verdict, and the shared test helpers"
run = "bats tools/render.bats tools/lib.bats tools/probe.bats tools/rustfs-probe.bats tools/validate.bats tools/fault-run.bats"

[tasks.test-nas]
description = "Test the deploy host tasks against a fake host, with ssh, sudo and the host's binaries stubbed"
run = "bats tools/nas.bats"

# Local only: it runs the tasks in a container on the engine's socket and
# downloads the Compose binary, so CI does not run it.
[tasks.nas-local-rehearsal]
description = "Run the deploy host tasks end to end against the local Docker engine, with ssh, sudo and tailscale stubbed"
run = "bash tools/nas-rehearsal.sh"

# Local only, and run once before a host deploy rather than in CI: it boots
# the stack under client load and stops Mimir for five minutes.
[tasks.fault-run]
description = "Stop Mimir for five minutes under client load and record receipts, restarts and raw cgroup memory"
run = "bash tools/fault-run.sh"

[tasks.test]
description = "Run every test suite"
run = ["mise run test-tools", "mise run test-stack", "mise run test-nas"]

[tasks.check]
description = "Fast quality bar: lint then test"
run = ["mise run lint", "mise run test"]

[tasks.check-all]
description = "Deeper bar: check plus the full-history gitleaks scan"
run = ["mise run check", "mise run devtools:gitleaks"]

# The stack tasks below need a Docker engine. They set every O11Y_* value
# themselves, with placeholders, so they behave the same with or without
# mise.local.toml.
[tasks.render]
description = "Render a release with placeholder values into tmp/render"
env = { O11Y_DATA_DIR = "/srv/o11y/data", O11Y_GRAFANA_ROOT_URL = "https://grafana.example.ts.net/" }
run = "bash tools/render.sh tmp/render"

[tasks.validate]
description = "Load the Compose models and run each component's config check from its pinned image"
run = "bash tools/validate.sh"

# The safe way to read a resolved model: `config` without -q prints the
# contents of every env file a model loads, and this one loads only a dummy.
[tasks.compose-config]
description = "Print the resolved Compose models as JSON, rendered with placeholders and a dummy S3 env file"
run = "bash tools/validate.sh --model"

[tasks.rustfs-probe]
description = "Exercise RustFS alone: credentials, multipart, listing and recovery after a kill"
run = "bash tools/rustfs-probe.sh"

[tasks.smoke]
description = "Boot the stack from clean and prove it stores and returns telemetry"
run = "bash tools/smoke.sh"

# The tasks below act on the deploy host over SSH, on the real O11Y_* values
# from mise.local.toml. deploy-plan is the exception: it makes no SSH call.
# The state-changing ones refuse to run unless O11Y_CONFIRM names the task,
# set on the command line of that one run.
[tasks.deploy-plan]
description = "Print what a deploy would do: images, ports, the release env file and the remote commands. No SSH"
run = "bash tools/nas.sh deploy-plan"

[tasks.preflight]
description = "Read facts off the deploy host: SSH, sudo, versions, listeners, free space, containers. Changes nothing"
run = "bash tools/nas.sh preflight"

[tasks.stage]
description = "Render a release, upload and verify it, and pull its images. Starts nothing. Needs O11Y_CONFIRM=stage"
run = "bash tools/nas.sh stage"

[tasks.gate-test]
description = "Rehearse a first deploy in the disposable o11y-gate project, then stop it. Needs O11Y_CONFIRM=gate-test"
run = "bash tools/nas.sh gate-test"

[tasks.gate-clean]
description = "Remove the gate rehearsal's directory, and nothing else. Needs O11Y_CONFIRM=gate-clean"
run = "bash tools/nas.sh gate-clean"

[tasks.deploy]
description = "Start the staged release under the deploy lock and promote it once the health gate passes. Needs O11Y_CONFIRM=deploy"
run = "bash tools/nas.sh deploy"

[tasks.rollback]
description = "Start the current release again, or the one before it with --previous, then run the health gate. Needs O11Y_CONFIRM=rollback"
run = "bash tools/nas.sh rollback"

[tasks.status]
description = "Show the current release, each service's state and readiness, container statistics and serve status"
run = "bash tools/nas.sh status"

[tasks.logs]
description = "Show the last 200 log lines of the stack, or of one service"
run = "bash tools/nas.sh logs"

[tasks.down]
description = "Remove the stack's containers; data, secrets, config and images stay. Needs O11Y_CONFIRM=down"
run = "bash tools/nas.sh down"

[tasks.serve-apply]
description = "Map the two Tailscale Services to the stack's loopback ports, without sudo. Needs O11Y_CONFIRM=serve-apply"
run = "bash tools/nas.sh serve-apply"

[tasks.serve-status]
description = "Show the deploy host's serve configuration"
run = "bash tools/nas.sh serve-status"

[tasks.serve-clear]
description = "Drain and clear the two Tailscale Services; never resets the rest. Needs O11Y_CONFIRM=serve-clear"
run = "bash tools/nas.sh serve-clear"

[tasks.smoke-remote]
description = "Prove receipt of one trace, log and metric through both Tailscale Services; --grpc adds a trace over gRPC"
run = "bash tools/nas.sh smoke-remote"

[tasks.grafana-password]
description = "Print the Grafana recovery password from the running container. Recovery only"
run = "bash tools/nas.sh grafana-password"
