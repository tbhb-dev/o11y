---
# Test-only services. All sit behind the "tools" profile, so `up` never
# starts them; the test scripts run them with `run --rm`, or start them
# by name, on the stack's network.
name: o11y

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  telemetrygen:
    # yamllint disable-line rule:line-length
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0@sha256:5350f77dbc914034321dc7629058e141996c8dc2cdde076d281e573efee1a67e
    profiles: ["tools"]
    restart: "no"
    logging: *logging

  s3probe:
    image: amazon/aws-cli:2.37.13@sha256:d32864c20087d486f5988c3e70817d67a73f584a47535cada9ad97e0ea1e5196
    profiles: ["tools"]
    restart: "no"
    logging: *logging
    env_file: ${O11Y_S3_ENV_FILE:?}
    environment:
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "/probe/probe.sh"]
    volumes:
      - ${O11Y_CONFIG_PROBE:?}:/probe:ro

  # A stand-in for Discord's webhook endpoint, for the boot test: busybox
  # httpd runs a CGI script that appends each request's path and body to
  # /tmp/posts and answers 204, as Discord does.
  alert-stub:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: ["tools"]
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /www/cgi-bin &&
        printf '%s\n' '#!/bin/sh'
        '{ echo "path=$$PATH_INFO"; head -c "$${CONTENT_LENGTH:-0}"; echo; } >>/tmp/posts'
        "printf 'Status: 204 No Content\\r\\n\\r\\n'" >/www/cgi-bin/hook &&
        chmod 755 /www/cgi-bin/hook &&
        exec httpd -f -p 8080 -h /www

  # A stand-in for the SMTP server, for the boot test: Mailpit, requiring
  # STARTTLS on a certificate it makes for itself, with one login whose
  # password is the test's sentinel, held here only as its bcrypt hash.
  # Its API on 8025 lists what arrived.
  # cspell:ignore Yjgzn HQAQVKSEZ
  alert-mail:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    profiles: ["tools"]
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s\n' 'smoke-user:$$2y$$10$$w4Wlj/fiwYjgznKggZ1WqOrGqGsI.DzJtHQAQVKSEZGhK44Ado5vW' >/tmp/smtp-auth &&
        exec /mailpit --smtp-auth-file /tmp/smtp-auth --smtp-require-starttls
        --smtp-tls-cert sans:alert-mail --smtp-tls-key sans:alert-mail
