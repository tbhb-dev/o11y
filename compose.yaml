---
# The observability stack: Grafana, Loki, Tempo, Mimir and Grafana Alloy,
# with RustFS as the S3 object store for the three backends. Run it from a
# rendered release (tools/render.sh), which supplies every O11Y_* value
# through an env file. compose.init.yaml must have run first: it creates the
# data directories and the secrets this file mounts and names as env_file.
# Validation loads the model with .env.validate, which points the env file at
# a dummy, so it never needs the generated one.
#
# Keep this file loadable by Compose 2.20.1: no include, develop,
# start_interval or long-form env_file.
name: o11y

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

x-common: &common
  restart: unless-stopped
  logging: *logging

x-needs-buckets: &needs-buckets
  s3-buckets: {condition: service_completed_successfully}

x-needs-backends: &needs-backends
  loki: {condition: service_started}
  tempo: {condition: service_started}
  mimir: {condition: service_started}

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  rustfs:
    <<: *common
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    stop_grace_period: 30s
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      # RustFS starts on a well-known default login when no key is set. The
      # file variables make its entrypoint fail on a missing or empty file.
      RUSTFS_ACCESS_KEY_FILE: /run/o11y/rustfs.access_key
      RUSTFS_SECRET_KEY_FILE: /run/o11y/rustfs.secret_key
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_OBS_LOGGER_LEVEL: info
      # Metrics go to Alloy's unpublished self receiver. An empty endpoint
      # would force RustFS's OpenTelemetry stdout exporters on, so it is set
      # here, and the stdout settings are explicit because their defaults
      # change outside production. The application log stays on stdout as
      # JSON; traces, OTLP logs and profiles are not exported.
      RUSTFS_OBS_ENDPOINT: http://alloy:4320
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_SERVICE_NAME: rustfs
      RUSTFS_OBS_USE_STDOUT: "false"
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_PROFILING_EXPORT_ENABLED: "false"
      RUSTFS_SCANNER_SPEED: slow
      RUSTFS_SCANNER_CYCLE: "3600"
      RUSTFS_UNSUPPORTED_FS_POLICY: fail
    volumes:
      - ${O11Y_DATA_DIR:?}/rustfs:/data
      - ${O11Y_DATA_DIR:?}/secrets/rustfs.access_key:/run/o11y/rustfs.access_key:ro
      - ${O11Y_DATA_DIR:?}/secrets/rustfs.secret_key:/run/o11y/rustfs.secret_key:ro
    mem_limit: 768m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]

  s3-buckets:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: "no"
    logging: *logging
    env_file: ${O11Y_S3_ENV_FILE:?}
    entrypoint: ["/bin/sh", "/buckets/buckets.sh"]
    volumes:
      - ${O11Y_CONFIG_BUCKETS:?}:/buckets:ro
    depends_on:
      rustfs: {condition: service_healthy}

  loki:
    <<: *common
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    env_file: ${O11Y_S3_ENV_FILE:?}
    volumes:
      - ${O11Y_CONFIG_LOKI:?}:/etc/loki:ro
      - ${O11Y_DATA_DIR:?}/loki:/loki
    mem_limit: 1g
    depends_on: *needs-buckets

  tempo:
    <<: *common
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    user: "10001:10001"
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    env_file: ${O11Y_S3_ENV_FILE:?}
    volumes:
      - ${O11Y_CONFIG_TEMPO:?}:/etc/tempo:ro
      - ${O11Y_DATA_DIR:?}/tempo:/var/tempo
    mem_limit: 1g
    depends_on:
      <<: *needs-buckets
      mimir: {condition: service_started}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]

  mimir:
    <<: *common
    image: grafana/mimir:3.2.2@sha256:04068a0a838b6efe9449a04c1d6acd74c7438ac6073dfcbb99c29892647525e3
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    env_file: ${O11Y_S3_ENV_FILE:?}
    volumes:
      - ${O11Y_CONFIG_MIMIR:?}:/etc/mimir:ro
      - ${O11Y_DATA_DIR:?}/mimir:/data
    mem_limit: 2g
    depends_on: *needs-buckets

  alloy:
    <<: *common
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      # Only for otelcol.processor.deltatocumulative; see config.alloy.
      - --stability.level=experimental
    # The Go runtime collects harder below this soft target, ahead of the
    # kernel's mem_limit. The grace period lets a stop with healthy backends
    # drain the queues.
    environment:
      GOMEMLIMIT: 600MiB
      O11Y_CLUSTER: ${O11Y_CLUSTER:-o11y}
      # Stamped on the stack's own OTLP metrics in place of whatever a
      # container reports. Stage and gate-test read the host name over SSH,
      # and it is private.
      O11Y_HOST_NAME: ${O11Y_HOST_NAME:-unknown-host}
      O11Y_ENVIRONMENT: ${O11Y_ENVIRONMENT:-production}
    stop_grace_period: 30s
    volumes:
      - ${O11Y_CONFIG_ALLOY:?}:/etc/alloy:ro
      - ${O11Y_DATA_DIR:?}/alloy:/var/lib/alloy/data
    # Loopback only, and not configurable: whatever fronts the stack reaches it
    # on the host, and Grafana lets anonymous users edit.
    ports:
      - "127.0.0.1:${O11Y_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${O11Y_OTLP_HTTP_PORT:-4318}:4318"
    mem_limit: 768m
    depends_on: *needs-backends
    healthcheck:
      <<: *healthcheck
      # The image has bash and no HTTP client.
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ $$status == *" 200 "* ]]

  grafana:
    <<: *common
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    user: "472:472"
    environment:
      GF_SERVER_ROOT_URL: ${O11Y_GRAFANA_ROOT_URL:?}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/o11y/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/o11y-grafana/provisioning
      # Email alerts, which render.sh turns on only with a recipient. The
      # password is read from its file and is empty while email is off.
      GF_SMTP_ENABLED: ${O11Y_ALERT_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${O11Y_ALERT_SMTP_HOST:-}:${O11Y_ALERT_SMTP_PORT:-}
      GF_SMTP_USER: ${O11Y_ALERT_SMTP_USER:-}
      GF_SMTP_PASSWORD__FILE: /run/o11y/alert_smtp_password
      GF_SMTP_FROM_ADDRESS: ${O11Y_ALERT_SMTP_FROM:-}
      GF_SMTP_FROM_NAME: o11y
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_SMTP_SKIP_VERIFY: ${O11Y_ALERT_SMTP_SKIP_VERIFY:-false}
      O11Y_ALERT_EMAIL_TO: ${O11Y_ALERT_EMAIL_TO:-}
    volumes:
      - ${O11Y_CONFIG_GRAFANA:?}:/etc/o11y-grafana:ro
      - ${O11Y_DATA_DIR:?}/grafana:/var/lib/grafana
      - ${O11Y_DATA_DIR:?}/secrets/grafana_admin_password:/run/o11y/grafana_admin_password:ro
      # Read by the contact point in provisioning/alerting/alerting.yaml.
      - ${O11Y_DATA_DIR:?}/secrets/alert_discord_webhook_url:/run/o11y/alert_discord_webhook_url:ro
      - ${O11Y_DATA_DIR:?}/secrets/alert_smtp_password:/run/o11y/alert_smtp_password:ro
    ports:
      - "127.0.0.1:${O11Y_GRAFANA_PORT:-3000}:3000"
    mem_limit: 768m
    depends_on: *needs-backends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
